<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdrawal - Winwave</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
<!-- Added FontAwesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
* { box-sizing: border-box; }
body {
    font-family: 'Poppins', sans-serif;
    background: #0f172a;
    color: white;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding-bottom: 70px; /* Offset for fixed bottom nav */
}

header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 40px;
    background: #020617;
}

header h2 {
    color: #38bdf8;
    margin: 0;
    font-size: 24px;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
}

nav a:hover {
    color: #38bdf8;
}

.container {
    background: #020617;
    padding: 25px;
    border-radius: 10px;
    width: 90%;
    max-width: 450px;
    margin-top: 30px;
    margin-bottom: 30px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
}

h3 {
    text-align: center;
    margin-bottom: 10px;
    color: #f8fafc;
}

.balance-text {
    text-align: center;
    color: #94a3b8;
    margin-bottom: 25px;
    font-size: 14px;
}

.balance-amount {
    color: #38bdf8;
    font-weight: bold;
    font-size: 18px;
}

.grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 20px;
}

.option-btn {
    background: #0f172a;
    border: 2px solid #1e293b;
    color: white;
    padding: 12px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
    text-align: center;
    font-size: 14px;
}

.option-btn:hover {
    border-color: #38bdf8;
}

.option-btn.active {
    background: #38bdf8;
    color: black;
    border-color: #38bdf8;
}

label {
    font-size: 12px;
    color: #94a3b8;
    margin-bottom: 5px;
    display: block;
}

input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #1e293b;
    border-radius: 5px;
    outline: none;
    background: #0f172a;
    color: white;
    font-size: 15px;
}

input:focus {
    border-color: #38bdf8;
}

.btn {
    width: 100%;
    padding: 12px;
    background: #38bdf8;
    border: none;
    border-radius: 5px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    color: black;
    transition: 0.3s;
    margin-top: 10px;
}

.btn:hover {
    background: #0ea5e9;
}

.btn:disabled {
    background: #475569;
    cursor: not-allowed;
}

.status-msg {
    text-align: center;
    font-weight: bold;
    margin-top: 15px;
    display: none;
    padding: 12px;
    border-radius: 5px;
    font-size: 14px;
}

.success { color: #34d399; background: rgba(52, 211, 153, 0.1); border: 1px solid #34d399; }
.error { color: #f87171; background: rgba(248, 113, 113, 0.1); border: 1px solid #f87171; }

.toggle-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #94a3b8;
    font-size: 14px;
    text-decoration: none;
    cursor: pointer;
}

.toggle-link:hover {
    color: #38bdf8;
    text-decoration: underline;
}

#historyView { display: none; }
.history-card { background: #0f172a; border: 1px solid #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
.history-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.history-amount { font-size: 16px; font-weight: bold; color: white; }
.history-method { font-size: 12px; color: #94a3b8; }
.history-date { font-size: 11px; color: #64748b; }

.badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
.badge.pending { background: rgba(250, 204, 21, 0.1); color: #facc15; border: 1px solid #facc15; }
.badge.approved { background: rgba(52, 211, 153, 0.1); color: #34d399; border: 1px solid #34d399; }
.badge.rejected { background: rgba(248, 113, 113, 0.1); color: #f87171; border: 1px solid #f87171; }

/* BOTTOM NAVIGATION */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #020617;
    display: flex;
    justify-content: space-around;
    padding: 10px 0;
    box-shadow: 0 -4px 6px rgba(0,0,0,0.3);
    z-index: 1000;
}

.bottom-nav a {
    color: #94a3b8;
    text-decoration: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 12px;
    transition: 0.3s;
}

.bottom-nav a i {
    font-size: 20px;
    margin-bottom: 4px;
}

.bottom-nav a:hover, .bottom-nav a.active {
    color: #38bdf8;
}

/* MOBILE RESPONSIVE */
@media (max-width: 600px) {
    header { padding: 15px 20px; }
    .container { padding: 20px; width: 95%; margin-top: 20px;}
    .grid-2 { grid-template-columns: 1fr; gap: 10px; }
}
</style>
</head>

<body>

<header>
    <h2>Winwave</h2>
    <nav>
        <a href="dashboard.html">← Back</a>
    </nav>
</header>

<div class="container">

    <!-- FORM VIEW -->
    <div id="formView">
        <h3>Withdraw Funds</h3>
        <p class="balance-text">Available Balance: <span class="balance-amount" id="displayBalance">Rs. 0</span></p>

        <label>Select Method</label>
        <div class="grid-2">
            <div class="option-btn method-btn" onclick="selectMethod(this, 'Easypaisa')">Easypaisa</div>
            <div class="option-btn method-btn" onclick="selectMethod(this, 'JazzCash')">JazzCash</div>
        </div>

        <label>Account Title (Name)</label>
        <input type="text" id="accountName" placeholder="e.g. Qasam Ali">

        <label>Account Number</label>
        <input type="number" id="accountNumber" placeholder="03XXXXXXXXX">

        <label>Amount (Rs.)</label>
        <input type="number" id="withdrawAmount" placeholder="Min Rs. 500">

        <button class="btn" id="submitBtn" onclick="submitWithdrawal()">Submit Request</button>

        <div id="statusMessage" class="status-msg"></div>

        <a class="toggle-link" onclick="switchView('history')">View Withdrawal History</a>
    </div>

    <!-- HISTORY VIEW -->
    <div id="historyView">
        <h3>Withdrawal History</h3>
        
        <div id="historyList">
        </div>

        <a class="toggle-link" onclick="switchView('form')">← Back to Withdrawal Form</a>
    </div>

</div>

<!-- BOTTOM NAVIGATION -->
<div class="bottom-nav">
    <a href="index.html">
        <i class="fas fa-home"></i>
        <span>Home</span>
    </a>
    <a href="promotion.html">
        <i class="fas fa-bullhorn"></i>
        <span>Promotion</span>
    </a>
    <a href="earn.html">
        <i class="fas fa-coins"></i>
        <span>Earn</span>
    </a>
    <a href="wallet.html" class="active">
        <i class="fas fa-wallet"></i>
        <span>Wallet</span>
    </a>
</div>

<script>
    let selectedMethod = "";
    
    // Naye balances read karna
    let depositBalance = localStorage.getItem('winwave_deposit_balance') ? parseInt(localStorage.getItem('winwave_deposit_balance')) : 5000;
    let earnBalance = localStorage.getItem('winwave_earn_balance') ? parseInt(localStorage.getItem('winwave_earn_balance')) : 0;
    let availableBalance = depositBalance + earnBalance; 

    // Page load hone par balance dikhana
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('displayBalance').innerText = `Rs. ${availableBalance.toLocaleString()}`;
    });

    function selectMethod(element, method) {
        document.querySelectorAll('.method-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        selectedMethod = method;
    }

    function switchView(view) {
        if (view === 'history') {
            document.getElementById('formView').style.display = 'none';
            document.getElementById('historyView').style.display = 'block';
        } else {
            document.getElementById('historyView').style.display = 'none';
            document.getElementById('formView').style.display = 'block';
            document.getElementById('statusMessage').style.display = 'none'; 
        }
    }

    function submitWithdrawal() {
        const accName = document.getElementById('accountName').value.trim();
        const accNumber = document.getElementById('accountNumber').value.trim();
        const amount = parseInt(document.getElementById('withdrawAmount').value);
        const statusMsg = document.getElementById('statusMessage');
        const submitBtn = document.getElementById('submitBtn');

        if (!selectedMethod) return showError("Please select a withdrawal method.");
        if (!accName) return showError("Please enter your account title.");
        if (accNumber.length !== 11) return showError("Please enter a valid 11-digit mobile number.");
        if (!amount || amount < 500) return showError("Minimum withdrawal amount is Rs. 500.");
        if (amount > availableBalance) return showError("Insufficient balance.");

        submitBtn.disabled = true;
        submitBtn.innerText = "Submitting...";
        statusMsg.style.display = "none";

        setTimeout(() => {
            // Withdrawal ki deduction logic (Pehle Earn balance se katay ga)
            if (amount <= earnBalance) {
                earnBalance -= amount;
            } else {
                let remaining = amount - earnBalance;
                earnBalance = 0;
                depositBalance -= remaining;
            }

            availableBalance = depositBalance + earnBalance;
            
            // Naya balance LocalStorage mein save karna
            localStorage.setItem('winwave_earn_balance', earnBalance);
            localStorage.setItem('winwave_deposit_balance', depositBalance);

            // Screen par balance update karna
            document.getElementById('displayBalance').innerText = `Rs. ${availableBalance.toLocaleString()}`;

            showSuccess(`Request Submitted Successfully!\nYour withdrawal of Rs. ${amount.toLocaleString()} is currently Pending.`);
            
            addRecordToHistory(amount, selectedMethod, accNumber);

            document.getElementById('accountName').value = "";
            document.getElementById('accountNumber').value = "";
            document.getElementById('withdrawAmount').value = "";
            
            submitBtn.innerText = "Submit Request";
            submitBtn.disabled = false;

        }, 1500); 
    }

    function addRecordToHistory(amount, method, account) {
        const historyList = document.getElementById('historyList');
        
        const dateObj = new Date();
        const options = { day: 'numeric', month: 'short', year: 'numeric' };
        const formattedDate = dateObj.toLocaleDateString('en-GB', options); 
        
        const maskedAccount = account.substring(0, 4) + "XXXX" + account.substring(8);

        const newCard = `
            <div class="history-card">
                <div class="history-flex">
                    <span class="history-amount">Rs. ${amount.toLocaleString()}</span>
                    <span class="badge pending">Pending</span>
                </div>
                <div class="history-flex">
                    <span class="history-method">${method} - ${maskedAccount}</span>
                </div>
                <span class="history-date">${formattedDate}</span>
            </div>
        `;

        historyList.insertAdjacentHTML('afterbegin', newCard);
    }

    function showError(message) {
        const statusMsg = document.getElementById('statusMessage');
        statusMsg.style.display = "block";
        statusMsg.className = "status-msg error";
        statusMsg.innerText = message;
    }

    function showSuccess(message) {
        const statusMsg = document.getElementById('statusMessage');
        statusMsg.style.display = "block";
        statusMsg.className = "status-msg success";
        statusMsg.innerText = message;
    }
</script>

</body>
</html>
