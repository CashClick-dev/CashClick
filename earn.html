<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earn Ads - Winwave</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
* { box-sizing: border-box; }

body {
    font-family: 'Poppins', sans-serif;
    background: #0f172a;
    color: white;
    margin: 0;
    padding-top: 70px;
    padding-bottom: 90px; 
}

/* FIXED HEADER */
header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 40px;
    background: #020617;
    z-index: 1000;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
}

header .logo { color: #38bdf8; font-size: 24px; font-weight: bold; }
header .dp { width: 40px; height: 40px; border-radius: 50%; background: #38bdf8; color: #020617; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 16px; border: 2px solid #0ea5e9; }

/* CONTAINER */
.container { padding: 20px; max-width: 1000px; margin: 0 auto; }

/* PLAN SECTION (Har plan ka alag box) */
.plan-section {
    background: #020617;
    border: 1px solid rgba(56, 189, 248, 0.2);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 30px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}

.plan-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #1e293b;
    padding-bottom: 15px;
    margin-bottom: 20px;
}

.plan-header h2 {
    color: #22c55e;
    margin: 0;
    font-size: 18px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.plan-header p {
    color: #94a3b8;
    margin: 0;
    font-size: 14px;
}

/* NO PLAN MESSAGE */
.no-plan-msg {
    text-align: center;
    padding: 40px 20px;
    background: #020617;
    border-radius: 10px;
    display: none; /* JS se show hoga */
    border: 1px solid rgba(239, 68, 68, 0.2);
}
.no-plan-msg h3 { color: #ef4444; }
.no-plan-msg a { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #38bdf8; color: black; text-decoration: none; font-weight: bold; border-radius: 5px; }

/* ADS GRID */
.ads-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }

.ad-card {
    background: #0f172a;
    border: 1px solid #1e293b;
    border-radius: 10px;
    padding: 20px 10px;
    text-align: center;
    transition: 0.3s;
}
.ad-card i { font-size: 30px; color: #38bdf8; margin-bottom: 10px; }
.ad-card h4 { margin: 0 0 15px 0; font-size: 14px; }
.ad-btn {
    width: 100%; padding: 8px; border: none; background: #38bdf8; color: black; font-weight: bold; cursor: pointer; border-radius: 5px; font-size: 12px;
}
.ad-btn:hover { background: #0ea5e9; }
.ad-btn:disabled { background: #1e293b; color: #64748b; cursor: not-allowed; }
.ad-btn.watched { background: #22c55e; color: white; border: none; }

/* BALANCE DISPLAY */
.current-balance { text-align: center; font-size: 18px; margin-bottom: 30px; color: #f8fafc; background: #020617; padding: 20px; border-radius: 10px; border: 1px solid rgba(34, 197, 94, 0.3); }
.current-balance span { color: #22c55e; font-weight: bold; font-size: 26px; display: block; margin-top: 5px; }

/* BOTTOM NAVIGATION */
.bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #020617; display: flex; justify-content: space-around; padding: 10px 0; box-shadow: 0 -4px 6px rgba(0,0,0,0.3); z-index: 1000; }
.bottom-nav a { color: #94a3b8; text-decoration: none; display: flex; flex-direction: column; align-items: center; font-size: 12px; transition: 0.3s; }
.bottom-nav a i { font-size: 20px; margin-bottom: 4px; }
.bottom-nav a:hover, .bottom-nav a.active { color: #38bdf8; }

@media (max-width: 600px) { 
    header { padding: 15px 20px; } 
    .plan-header { flex-direction: column; gap: 10px; text-align: center; }
}
</style>
</head>
<body>

<header>
    <div class="logo">Winwave</div>
    <div class="dp" title="Qasam Ali">QA</div>
</header>

<div class="container">
    
    <!-- Balance Show Hoga (Sirf Earn Balance) -->
    <div class="current-balance" id="balanceDisplay">
        Your Earn Balance: <span id="earnBalanceAmount">Rs. 0</span>
    </div>

    <!-- Agar koi plan nahi hai to ye show hoga -->
    <div class="no-plan-msg" id="noPlanMsg">
        <h3>Aap ne abhi tak koi Plan buy nahi kiya!</h3>
        <p>Ads dekhne ke liye pehle plan khareedein.</p>
        <a href="index.html">Buy Plan Now</a>
    </div>

    <!-- Multiple Plans Yahan Generate Hongay -->
    <div id="allPlansContainer"></div>

</div>

<!-- BOTTOM NAVIGATION -->
<div class="bottom-nav">
    <a href="index.html">
        <i class="fas fa-home"></i>
        <span>Home</span>
    </a>
    <a href="promotion.html">
        <i class="fas fa-bullhorn"></i>
        <span>Promotion</span>
    </a>
    <a href="earn.html" class="active">
        <i class="fas fa-coins"></i>
        <span>Earn</span>
    </a>
    <a href="wallet.html">
        <i class="fas fa-wallet"></i>
        <span>Wallet</span>
    </a>
</div>

<!-- Type module zaroori hai Firebase imports ke liye -->
<script type="module">
  // Import Firebase modules via CDN for plain HTML
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyD9PTKknfHGgaZM4bhH_22HBT9tKkplCcE",
    authDomain: "cashwin-2cfdb.firebaseapp.com",
    projectId: "cashwin-2cfdb",
    storageBucket: "cashwin-2cfdb.firebasestorage.app",
    messagingSenderId: "42491408938",
    appId: "1:42491408938:web:719a556f8901e19b35c953",
    measurementId: "G-SVBJQDMX79"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Baaki pehle wala code shuru
  document.addEventListener('DOMContentLoaded', () => {
      
      onAuthStateChanged(auth, async (user) => {

          if (!user) {
              alert("Please login first");
              window.location.href = "login.html";
              return;
          }

          const uid = user.uid;

          const userRef = doc(db, "users", uid);
          const snap = await getDoc(userRef);

          if (!snap.exists()) return;

          const data = snap.data();

          let earnBalance = data.earnBalance || 0;
          let activePlans = data.activePlans || [];
          let watchedAds = data.watchedAds || [];

          const balanceDisplay = document.getElementById('earnBalanceAmount');
          const noPlanMsg = document.getElementById('noPlanMsg');
          const allPlansContainer = document.getElementById('allPlansContainer');

          balanceDisplay.innerText = "Rs. " + earnBalance.toLocaleString();

          const plansInfo = {
              '1': 10,
              '2': 20,
              '3': 30,
              '4': 40,
              '5': 50
          };

          const adReward = 20;

          if (activePlans.length === 0) {
              noPlanMsg.style.display = 'block';
              return;
          }

          activePlans.forEach(planId => {

              let totalAds = plansInfo[planId];

              let planSection = document.createElement('div');
              planSection.className = 'plan-section';

              planSection.innerHTML = `
                  <div class="plan-header">
                      <h2>Plan ${planId} Active</h2>
                      <p>Available Ads: ${totalAds}</p>
                  </div>
                  <div class="ads-grid" id="ads-${planId}"></div>
              `;

              allPlansContainer.appendChild(planSection);

              let grid = document.getElementById(`ads-${planId}`);

              for (let i = 1; i <= totalAds; i++) {

                  let adId = `plan${planId}-ad${i}`;
                  let isWatched = watchedAds.includes(adId);

                  let card = document.createElement('div');
                  card.className = 'ad-card';

                  card.innerHTML = `
                      <h4>Task ${i}</h4>
                      <button class="ad-btn ${isWatched ? 'watched' : ''}" id="btn-${adId}" ${isWatched ? 'disabled' : ''}>
                          ${isWatched ? 'Watched' : 'Watch Ad'}
                      </button>
                  `;

                  grid.appendChild(card);

                  let btn = document.getElementById(`btn-${adId}`);

                  btn.onclick = async () => {
                      if (watchedAds.includes(adId)) return;

                      btn.innerText = "Loading...";
                      btn.disabled = true;

                      setTimeout(async () => {

                          earnBalance += adReward;
                          watchedAds.push(adId);

                          await updateDoc(userRef, {
                              earnBalance: earnBalance,
                              watchedAds: watchedAds
                          });

                          balanceDisplay.innerText = "Rs. " + earnBalance.toLocaleString();

                          btn.innerText = "Watched";
                          btn.classList.add('watched');

                      }, 2000);

                  };
              }

          });

      });

  });
</script>

</body>
</html>
