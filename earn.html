* { box-sizing: border-box; }

body {
    font-family: 'Poppins', sans-serif;
    background: #0f172a;
    color: white;
    margin: 0;
    padding-top: 70px;
    padding-bottom: 90px; 
}

/* FIXED HEADER */
header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 40px;
    background: #020617;
    z-index: 1000;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
}

header .logo { display: flex; align-items: center; }
header .logo img {
    max-height: 40px;
    width: auto;
}

header .dp { width: 40px; height: 40px; border-radius: 50%; background: #38bdf8; color: #020617; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 16px; border: 2px solid #0ea5e9; }

/* CONTAINER */
.container { padding: 20px; max-width: 1000px; margin: 0 auto; }

/* PLAN SECTION */
.plan-section {
    background: #020617;
    border: 1px solid rgba(56, 189, 248, 0.2);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 30px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}

.plan-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #1e293b;
    padding-bottom: 15px;
    margin-bottom: 20px;
}

.plan-header h2 {
    color: #22c55e;
    margin: 0;
    font-size: 18px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.plan-header p {
    color: #94a3b8;
    margin: 0;
    font-size: 14px;
}

/* NO PLAN MESSAGE */
.no-plan-msg {
    text-align: center;
    padding: 40px 20px;
    background: #020617;
    border-radius: 10px;
    display: none; 
    border: 1px solid rgba(239, 68, 68, 0.2);
}
.no-plan-msg h3 { color: #ef4444; }
.no-plan-msg a { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #38bdf8; color: black; text-decoration: none; font-weight: bold; border-radius: 5px; }

/* ADS GRID */
.ads-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }

.ad-card {
    background: #0f172a;
    border: 1px solid #1e293b;
    border-radius: 10px;
    padding: 20px 10px;
    text-align: center;
    transition: 0.3s;
}
.ad-card i { font-size: 30px; color: #38bdf8; margin-bottom: 10px; }
.ad-card h4 { margin: 0 0 15px 0; font-size: 14px; }
.ad-btn {
    width: 100%; padding: 8px; border: none; background: #38bdf8; color: black; font-weight: bold; cursor: pointer; border-radius: 5px; font-size: 12px;
}
.ad-btn:hover { background: #0ea5e9; }
.ad-btn:disabled { background: #1e293b; color: #64748b; cursor: not-allowed; }
.ad-btn.watched { background: #22c55e; color: white; border: none; }

/* BALANCE DISPLAY */
.balances-wrapper { display: flex; gap: 15px; margin-bottom: 30px; }
.current-balance { flex: 1; text-align: center; font-size: 16px; color: #f8fafc; background: #020617; padding: 20px; border-radius: 10px; border: 1px solid rgba(34, 197, 94, 0.3); }
.current-balance span { color: #22c55e; font-weight: bold; font-size: 24px; display: block; margin-top: 5px; }
.yesterday-balance { border: 1px solid rgba(56, 189, 248, 0.3); }
.yesterday-balance span { color: #38bdf8; }

/* BOTTOM NAVIGATION */
.bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #020617; display: flex; justify-content: space-around; padding: 10px 0; box-shadow: 0 -4px 6px rgba(0,0,0,0.3); z-index: 1000; }
.bottom-nav a { color: #94a3b8; text-decoration: none; display: flex; flex-direction: column; align-items: center; font-size: 12px; transition: 0.3s; }
.bottom-nav a i { font-size: 20px; margin-bottom: 4px; }
.bottom-nav a:hover, .bottom-nav a.active { color: #38bdf8; }

/* VIDEO MODAL STYLES */
.modal-overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.95); z-index: 2000; justify-content: center; align-items: center;
}
.video-modal-content {
    background: #020617; width: 90%; max-width: 600px; border: 1px solid #38bdf8; border-radius: 10px; padding: 20px; position: relative;
}
.close-modal {
    position: absolute; top: 10px; right: 15px; color: #ef4444; font-size: 24px; font-weight: bold; cursor: pointer; user-select: none; z-index: 30;
}
.timeline-container {
    width: 100%; height: 8px; background: #1e293b; border-radius: 5px; overflow: hidden; margin-bottom: 15px; margin-top: 15px;
}
.timeline-bar {
    width: 0%; height: 100%; background: #22c55e; transition: width 0.2s linear;
}

/* YOUTUBE EMBED CONTAINER WITH TRANSPARENT SHIELD */
.yt-wrapper {
    position: relative;
    width: 100%;
    padding-top: 56.25%; /* 16:9 Aspect Ratio */
    border-radius: 8px;
    overflow: hidden;
    background: black;
}
.yt-wrapper iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
}
.yt-shield {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    background: transparent;
}

#videoStatusText {
    text-align: center; font-size: 14px; margin-top: 15px; color: #94a3b8;
}

@media (max-width: 600px) { 
    header { padding: 15px 20px; } 
    .plan-header { flex-direction: column; gap: 10px; text-align: center; }
    .balances-wrapper { flex-direction: column; gap: 10px; } /* Mobile par boxes upar neche honge */

  let ytPlayer = null;

  document.addEventListener('DOMContentLoaded', () => {
      
      onAuthStateChanged(auth, async (user) => {

          if (!user) {
              alert("Please login first");
              window.location.href = "login.html";
              return;
          }

          const uid = user.uid;
          const userRef = doc(db, "users", uid);
          const snap = await getDoc(userRef);

          if (!snap.exists()) return;

          const data = snap.data();
          let earnBalance = data.earnBalance || 0;
          let activePlans = data.activePlans || [];
          let watchedAds = data.watchedAds || [];
          let dailyEarnings = data.dailyEarnings || {};
          let lastAdDate = data.lastAdDate || ""; // NEW: din track karne ke liye

          // DATE LOGIC (Today aur Yesterday nikalne ke liye)
          function getFormattedDate(date) {
              let d = new Date(date),
                  month = '' + (d.getMonth() + 1),
                  day = '' + d.getDate(),
                  year = d.getFullYear();
              if (month.length < 2) month = '0' + month;
              if (day.length < 2) day = '0' + day;
              return [year, month, day].join('-');
          }

          let todayStr = getFormattedDate(new Date());
          
          let yestObj = new Date();
          yestObj.setDate(yestObj.getDate() - 1);
          let yestStr = getFormattedDate(yestObj);
          
          // ==============================================================
          // FIX: DAILY RESET LOGIC (Raat 12 baje ke baad Ads reset honge)
          // ==============================================================
          if (lastAdDate !== todayStr) {
              watchedAds = []; // Aaj ke naye din ke liye purane ads reset kar diye
              lastAdDate = todayStr; // Current date set kardi
              
              // Database mein update kar rahe hain taake users fresh start lein
              await updateDoc(userRef, {
                  watchedAds: watchedAds,
                  lastAdDate: lastAdDate
              });
          }
          // ==============================================================

          let yesterdayEarn = dailyEarnings[yestStr] || 0;

          const balanceDisplay = document.getElementById('earnBalanceAmount');
          const yesterdayDisplay = document.getElementById('yesterdayBalanceAmount');
          const noPlanMsg = document.getElementById('noPlanMsg');
          const allPlansContainer = document.getElementById('allPlansContainer');

          balanceDisplay.innerText = "Rs. " + earnBalance.toLocaleString();
          yesterdayDisplay.innerText = "Rs. " + yesterdayEarn.toLocaleString();

          const plansInfo = { '1': 10, '2': 20, '3': 30, '4': 40, '5': 50 };
          const adReward = 20;

          if (activePlans.length === 0) {
              noPlanMsg.style.display = 'block';
              return;
          }

          // Modal & DOM Elements
          const videoModal = document.getElementById('videoModal');
          const closeVideoModal = document.getElementById('closeVideoModal');
          const timelineBar = document.getElementById('timelineBar');
          const videoStatusText = document.getElementById('videoStatusText');
          
          let currentAdBtn = null;
          let currentAdId = null;
          let rewardGiven = false;

          // Close Modal Handler (No Reward on premature exit)
          closeVideoModal.onclick = () => {
              if (ytPlayer && ytPlayer.stopVideo) {
                  ytPlayer.stopVideo();
              }
              clearInterval(ytTimerInterval);
              videoModal.style.display = 'none';
              
              if (!rewardGiven && currentAdBtn) {
                  currentAdBtn.innerText = "Watch Ad";
                  currentAdBtn.disabled = false;
              }
          };

          // Function when YouTube video ends successfully
          async function handleVideoCompleted() {
              if (rewardGiven) return;
              rewardGiven = true;

              videoStatusText.style.color = "#22c55e";
              videoStatusText.innerText = "Task Completed! Updating balance...";
              
              earnBalance += adReward;
              watchedAds.push(currentAdId);
              
              // DAILY EARNING UPDATE
              dailyEarnings[todayStr] = (dailyEarnings[todayStr] || 0) + adReward;

              await updateDoc(userRef, {
                  earnBalance: earnBalance,
                  watchedAds: watchedAds,
                  dailyEarnings: dailyEarnings,
                  lastAdDate: todayStr // Ye bhi lazmi update hoga ab
              });

              balanceDisplay.innerText = "Rs. " + earnBalance.toLocaleString();
              
              currentAdBtn.innerText = "Watched";
              currentAdBtn.classList.add('watched');

              setTimeout(() => {
                  videoModal.style.display = 'none';
              }, 1200);
          }

          // Track YouTube Progress for Timeline Bar
          function startProgressTracker() {
              clearInterval(ytTimerInterval);
              ytTimerInterval = setInterval(() => {
                  if (ytPlayer && ytPlayer.getCurrentTime && ytPlayer.getDuration) {
                      const currentTime = ytPlayer.getCurrentTime();
                      const duration = ytPlayer.getDuration();
                      if (duration > 0) {
                          const percentage = (currentTime / duration) * 100;
                          timelineBar.style.width = percentage + "%";
                      }
                  }
              }, 200);
          }

          // YouTube Player State Change Listener
          window.onYouTubePlayerStateChange = function(event) {
              if (event.data === YT.PlayerState.PLAYING) {
                  startProgressTracker();
              } else if (event.data === YT.PlayerState.ENDED) {
                  clearInterval(ytTimerInterval);
                  timelineBar.style.width = "100%";
                  handleVideoCompleted();
              }
          };

          // Load & Play Youtube Video Helper
          function playYouTubeVideo(videoId) {
              if (!ytPlayer) {
                  ytPlayer = new YT.Player('youtubePlayer', {
                      height: '100%',
                      width: '100%',
                      videoId: videoId,
                      playerVars: {
                          'autoplay': 1,
                          'controls': 0,
                          'disablekb': 1,
                          'modestbranding': 1,
                          'rel': 0,
                          'fs': 0,
                          'playsinline': 1
                      },
                      events: {
                          'onStateChange': (e) => window.onYouTubePlayerStateChange(e)
                      }
                  });
              } else {
                  ytPlayer.loadVideoById(videoId);
              }
          }

          // Render Active Plans & Tasks Grid
          activePlans.forEach(planId => {
              let totalAds = plansInfo[planId];
              let planSection = document.createElement('div');
              planSection.className = 'plan-section';

              planSection.innerHTML = `
                  <div class="plan-header">
                      <h2>Plan ${planId} Active</h2>
                      <p>Available Tasks: ${totalAds}</p>
                  </div>
                  <div class="ads-grid" id="ads-${planId}"></div>
              `;

              allPlansContainer.appendChild(planSection);
              let grid = document.getElementById(`ads-${planId}`);

              for (let i = 1; i <= totalAds; i++) {
                  let adId = `plan${planId}-ad${i}`;
                  let isWatched = watchedAds.includes(adId);

                  let card = document.createElement('div');
                  card.className = 'ad-card';

                  card.innerHTML = `
                      <h4>Task ${i}</h4>
                      <button class="ad-btn ${isWatched ? 'watched' : ''}" id="btn-${adId}" ${isWatched ? 'disabled' : ''}>
                          ${isWatched ? 'Watched' : 'Watch Ad'}
                      </button>
                  `;

                  grid.appendChild(card);
                  let btn = document.getElementById(`btn-${adId}`);

                  btn.onclick = async () => {
                      if (watchedAds.includes(adId)) return;

                      btn.innerText = "Playing...";
                      btn.disabled = true;

                      currentAdBtn = btn;
                      currentAdId = adId;
                      rewardGiven = false;
                      timelineBar.style.width = "0%";
                      videoStatusText.style.color = "#94a3b8";
                      videoStatusText.innerText = "Please watch the full video without skipping to earn reward.";

                      // Select YouTube Video ID randomly se pick karna
                      const randomVideoId = youtubeVideoPool[Math.floor(Math.random() * youtubeVideoPool.length)];

                      videoModal.style.display = 'flex';
                      playYouTubeVideo(randomVideoId);
                  };
              }
          });
      });
