<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deposit - Winwave</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
<!-- Added FontAwesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
* { box-sizing: border-box; }
body { 
    font-family: 'Poppins', sans-serif; background: #0f172a; color: white; 
    margin: 0; display: flex; flex-direction: column; align-items: center; 
    min-height: 100vh; padding-top: 80px; padding-bottom: 70px;
}

/* FIXED HEADER */
header {
    position: fixed; top: 0; left: 0; width: 100%;
    display: flex; justify-content: space-between; align-items: center;
    padding: 15px 40px; background: #020617; z-index: 1000;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
}

header .logo { display: flex; align-items: center; }
header .dp {
    width: 40px; height: 40px; border-radius: 50%; background: #38bdf8;
    color: #020617; display: flex; justify-content: center; align-items: center;
    font-weight: bold; font-size: 16px; cursor: pointer; border: 2px solid #0ea5e9;
}

.container { 
    background: #020617; padding: 30px; border-radius: 10px; width: 90%; 
    max-width: 500px; margin-top: 20px; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
}
.back-link { color: #38bdf8; text-decoration: none; font-size: 14px; font-weight: bold; display: block; margin-bottom: 20px; }

h3 { text-align: center; margin-top: 0; margin-bottom: 20px; color: #94a3b8; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 10px; margin-bottom: 20px; }
.option-btn { background: #0f172a; border: 2px solid #1e293b; color: white; padding: 15px 10px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; text-align: center; font-size: 14px;}
.option-btn:hover { border-color: #38bdf8; }
.option-btn.active { background: #38bdf8; color: black; border-color: #38bdf8; }
input[type="text"] { width: 100%; padding: 12px; margin: 10px 0 20px 0; border: 1px solid #1e293b; border-radius: 5px; outline: none; background: #0f172a; color: white; font-size: 16px; text-align: center; }
input[type="text"]:focus { border-color: #38bdf8; }

/* File Input Style */
input[type="file"] {
    width: 100%; padding: 10px; margin: 10px 0 20px 0; border: 1px dashed #1e293b; 
    border-radius: 5px; background: #0f172a; color: #94a3b8; font-size: 14px; cursor: pointer;
}
input[type="file"]:focus { border-color: #38bdf8; }

.btn { width: 100%; padding: 12px; background: #38bdf8; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; color: black; transition: 0.3s; }
.btn:hover { background: #0ea5e9; }
.btn:disabled { background: #475569; cursor: not-allowed; }
#step2 { display: none; }
.status-msg { text-align: center; font-weight: bold; margin-top: 15px; display: none; padding: 12px; border-radius: 5px; font-size: 14px; }
.loading { color: #facc15; background: rgba(250, 204, 21, 0.1); border: 1px solid #facc15;}
.success { color: #34d399; background: rgba(52, 211, 153, 0.1); border: 1px solid #34d399;}
.error { color: #f87171; background: rgba(248, 113, 113, 0.1); border: 1px solid #f87171;}

/* BOTTOM NAVIGATION */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #020617;
    display: flex;
    justify-content: space-around;
    padding: 10px 0;
    box-shadow: 0 -4px 6px rgba(0,0,0,0.3);
    z-index: 1000;
}

.bottom-nav a {
    color: #94a3b8;
    text-decoration: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 12px;
    transition: 0.3s;
}

.bottom-nav a i {
    font-size: 20px;
    margin-bottom: 4px;
}

.bottom-nav a:hover, .bottom-nav a.active {
    color: #38bdf8;
}

/* MOBILE RESPONSIVE */
@media (max-width: 600px) {
    header { padding: 15px 20px; }
    .container { padding: 20px; width: 95%; }
    .grid-2 { grid-template-columns: 1fr; gap: 10px; }
    .grid-3 { grid-template-columns: repeat(3, 1fr); gap: 10px; }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        <img src="logo.png" alt="Logo" style="max-height: 40px; width: auto;">
    </div>
    <div class="dp" title="User">U</div>
</header>

<div class="container">
    <a href="wallet.html" class="back-link">← Back to Wallet</a>
    
    <div id="step1">
        <h3>Select Payment Method</h3>
        <div class="grid-2">
            <div class="option-btn method-btn" onclick="selectMethod(this, 'easypaisa')">Easypaisa</div>
            <div class="option-btn method-btn" onclick="selectMethod(this, 'jazzcash')">JazzCash</div>
        </div>

        <h3>Select Amount (Rs.)</h3>
        <div class="grid-3">
            <div class="option-btn amount-btn" onclick="selectAmount(this, 500)">500</div>
            <div class="option-btn amount-btn" onclick="selectAmount(this, 1000)">1000</div>
            <div class="option-btn amount-btn" onclick="selectAmount(this, 1500)">1500</div>
            <div class="option-btn amount-btn" onclick="selectAmount(this, 2000)">2000</div>
            <div class="option-btn amount-btn" onclick="selectAmount(this, 2500)">2500</div>
        </div>

        <button class="btn" onclick="goToStep2()">Next Step</button>
        <button class="btn" style="margin-top: 15px; background: transparent; border: 2px solid #38bdf8; color: #38bdf8;" onclick="window.location.href='deposit_history.html'">Deposit History</button>
    </div>

    <div id="step2">
        <h3 id="paymentDetailsHeading">Pay Rs. 0</h3>
        <p style="text-align:center; font-size:14px; color:#94a3b8;">
            QR code scan karke payment karo. Payment ke baad transaction ID bhejo.
        </p>
    
        <div style="text-align:center; margin:20px 0;">
            <img src="qr-code.png" alt="Payment QR" style="width:220px; max-width:100%; border-radius:12px; border:1px solid #1e293b; background:#fff; padding:10px;">
        </div>
    
        <label style="display:block; text-align:left; color:#94a3b8; font-size:14px; margin-bottom:5px;">Transaction ID</label>
        <input type="text" id="txnId" placeholder="Enter transaction ID">
    
        <label style="display:block; text-align:left; color:#94a3b8; font-size:14px; margin-bottom:5px;">Payment Screenshot</label>
        <input type="file" id="paymentScreenshot" accept="image/*">
    
        <button class="btn" id="payBtn" onclick="submitDepositRequest()">Submit Deposit Request</button>
        <button class="btn" id="backBtn" style="background: transparent; color: #94a3b8; margin-top: 10px;" onclick="goBack()">Go Back</button>
    
        <div id="statusMessage" class="status-msg"></div>
    </div>
</div>

<div class="bottom-nav">
    <a href="index.html"><i class="fas fa-home"></i><span>Home</span></a>
    <a href="promotion.html"><i class="fas fa-bullhorn"></i><span>Promotion</span></a>
    <a href="earn.html"><i class="fas fa-coins"></i><span>Earn</span></a>
    <a href="wallet.html" class="active"><i class="fas fa-wallet"></i><span>Wallet</span></a>
</div>

<!-- Firebase SDK Initialization -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, addDoc, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD9PTKknfHGgaZM4bhH_22HBT9tKkplCcE",
    authDomain: "cashwin-2cfdb.firebaseapp.com",
    projectId: "cashwin-2cfdb",
    storageBucket: "cashwin-2cfdb.firebasestorage.app",
    messagingSenderId: "42491408938",
    appId: "1:42491408938:web:719a556f8901e19b35c953",
    measurementId: "G-SVBJQDMX79"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  let currentUser = null;

  onAuthStateChanged(auth, (user) => {
      if (!user) {
          window.location.href = "index.html";
          return;
      }
      currentUser = user;
      
      // Update DP initials based on user
      const name = user.displayName || user.email || "User";
      document.querySelector('.dp').innerText = name.charAt(0).toUpperCase();
  });

  async function submitDepositRequest() {
      const selectedAmount = window.selectedAmount;
      const selectedMethod = window.selectedMethod;
      const txnId = document.getElementById('txnId').value.trim();
      const fileInput = document.getElementById('paymentScreenshot');
      const payBtn = document.getElementById('payBtn');
      const statusMsg = document.getElementById('statusMessage');
  
      function showError(msg) {
          statusMsg.style.display = "block";
          statusMsg.className = "status-msg error";
          statusMsg.innerText = msg;
      }
  
      if (!currentUser) {
          alert("User not loaded yet.");
          return;
      }
  
      if (!selectedAmount || selectedAmount < 500) {
          showError("Amount select karo.");
          return;
      }
  
      if (!txnId) {
          showError("Transaction ID enter karo.");
          return;
      }
  
      // OPTIMISTIC UI UPDATE (0 Seconds Delay for User)
      payBtn.disabled = true;
      payBtn.innerHTML = "<i class='fa-solid fa-check'></i> Request Submitted!";
      payBtn.style.background = "#34d399"; // Green success color
      payBtn.style.color = "#000";
      
      statusMsg.style.display = "block";
      statusMsg.className = "status-msg success";
      statusMsg.innerText = "Aapki request instantly submit ho gayi hai! Background me process ho rahi hai...";
  
      // BACKGROUND PROCESSING (User doesn't have to wait for this to finish to see "Success")
      processUploadAndSave(fileInput, selectedAmount, selectedMethod, txnId);
  }

  async function processUploadAndSave(fileInput, selectedAmount, selectedMethod, txnId) {
      try {
          let uploadedUrl = "";
          
          if (fileInput.files.length > 0) {
              const file = fileInput.files[0];
              const formData = new FormData();
              formData.append("image", file);
              const imgbbApiKey = "93d284c5aa44dbf53e1d914cb86c5a85"; 
              
              const response = await fetch(`https://api.imgbb.com/1/upload?key=${imgbbApiKey}`, {
                  method: 'POST',
                  body: formData
              });
              
              const data = await response.json();
              if (data.success) {
                  uploadedUrl = data.data.url; 
              }
          }

          // Save Data in Firebase
          await addDoc(collection(db, "depositRequests"), {
              uid: currentUser.uid,
              name: currentUser.displayName || currentUser.email || "User",
              amount: selectedAmount,
              txnId: txnId,
              method: selectedMethod,
              screenshotUrl: uploadedUrl,
              status: "pending",
              createdAt: new Date().toISOString()
          });
  
          // Redirect to history automatically once safely saved
          window.location.href = "deposit_history.html";
  
      } catch (err) {
          console.error(err);
          const statusMsg = document.getElementById('statusMessage');
          statusMsg.className = "status-msg error";
          statusMsg.innerText = "Network issue! Request fail ho gayi, please try again.";
          
          const payBtn = document.getElementById('payBtn');
          payBtn.disabled = false;
          payBtn.style.background = "#38bdf8";
          payBtn.innerHTML = "Submit Deposit Request";
      }
  }
  
  window.submitDepositRequest = submitDepositRequest;
</script>

<script>
    var selectedMethod = ""; 
    var selectedAmount = 0; 
    
    function selectMethod(element, method) { 
        document.querySelectorAll('.method-btn').forEach(btn => btn.classList.remove('active')); 
        element.classList.add('active'); 
        window.selectedMethod = method; 
    }
    
    function selectAmount(element, amount) { 
        document.querySelectorAll('.amount-btn').forEach(btn => btn.classList.remove('active')); 
        element.classList.add('active'); 
        window.selectedAmount = amount; 
    }
    
    function goToStep2() { 
        if (!window.selectedMethod || !window.selectedAmount) { 
            alert("Please select both a method and an amount."); 
            return; 
        } 
        document.getElementById('step1').style.display = 'none'; 
        document.getElementById('step2').style.display = 'block'; 
        document.getElementById('paymentDetailsHeading').innerText = `Pay Rs. ${window.selectedAmount} via ${window.selectedMethod.toUpperCase()}`; 
    }
    
    function goBack() { 
        document.getElementById('step2').style.display = 'none'; 
        document.getElementById('step1').style.display = 'block'; 
        resetUI(); 
    }
    
    function resetUI() { 
        const payBtn = document.getElementById('payBtn'); 
        const statusMsg = document.getElementById('statusMessage'); 
        payBtn.disabled = false; 
        payBtn.innerHTML = "Submit Deposit Request"; 
        payBtn.style.background = "#38bdf8";
        payBtn.style.color = "black";
        statusMsg.style.display = "none"; 
        statusMsg.className = "status-msg"; 
        document.getElementById('txnId').value = "";
        document.getElementById('paymentScreenshot').value = "";
    }
</script>

</body>
</html>
